# Perfil 2x H200, teste rapido. Gerado a partir de configs/config_base_smoke.yaml. So mudam os valores que dependem do hardware;
# o resto deve continuar igual ao perfil da V100 (compare com: diff configs/config_base_smoke.yaml configs/h200/config_base_smoke.yaml).
# Copia do config_base.yaml para o teste rapido (00_smoke.pbs). So muda as pastas de saida.
# Configuracoes Gerais e de Caminhos - Pipeline BumbaLM-Embedding-4B

projeto:
  nome: "BumbaLM-Embedding-4B-Train"
  versao: "2.0.0"
  descricao: "Pipeline modular para treinamento contrastivo de embeddings juridicos brasileiros"
  seed: 42

# Caminhos dos Dados
dados:
  # Cluster tapajos: amostra de 60 mil acordaos de Camara do TJRS (scripts/amostrar_pares.py)
  diretorio_base_pares: "/home/fabio.lobato/bumbalm/Pares_Tribunais"
  diretorio_processados: "data/smoke_tjrs_h200"

  # Lista explicita dos arquivos de pares para processamento.
  # Comente ou descomente as linhas para incluir ou excluir tribunais:
  arquivos_pares:
    # --- TCC: ablacao de negativos com o TJRS. O pares_tjma.jsonl (Turmas Recursais) nao sustenta a tarefa ---
    - "pares_tjrs_amostra60k_camaras.jsonl"

    # --- TRIBUNAIS DE JUSTICA ESTADUAIS (rodada multi-tribunal, desativados no TCC) ---
    # - "pares_tjba.jsonl"
    # - "pares_tjdf.jsonl"
    # - "pares_tjes.jsonl"
    # - "pares_tjms.jsonl"
    # - "pares_tjpa.jsonl"
    # - "pares_tjpb.jsonl"
    # - "pares_tjpr.jsonl"
    # - "pares_tjrn.jsonl"
    # - "pares_tjro.jsonl"
    # - "pares_tjrr.jsonl"
    # - "pares_tjrs.jsonl"

    # --- TRIBUNAIS SUPERIORES E ESPECIALIZADOS (DESATIVADOS NESTE TESTE) ---
    # - "pares_stf.jsonl"
    # - "pares_tst.jsonl"
    # - "pares_tse.jsonl"
    # - "pares_stm.jsonl"
    # - "pares_tcu.jsonl"
    # - "pares_cnj.jsonl"
  
  # Mapeamento flexivel de nomes de colunas do arquivo bruto
  colunas:
    tribunal: "str_tribunal"          # Coluna com sigla do tribunal (ex.: TJMA, TJSP, TRF1)
    numero_processo: "str_numero_unico" # Coluna com numero CNJ ou identificador do processo
    ementa: "str_ementa"              # Coluna com o texto da ementa (query)
    inteiro_teor: "str_inteiro_teor"  # Coluna com o texto integral da decisao

# Diretorios de Saida de Modelos e Logs
saidas:
  diretorio_experimentos: "experiments"
  # Cada variante de negativos grava em experiments/<nome_experimento>/<variante>/
  nome_experimento: "smoke_tjrs_h200"
  # Informativo: no gpunode02 vale o cache padrao (~/.cache/huggingface), ver cluster/h200/caminhos.sh
  hf_cache_dir: "~/.cache/huggingface"
