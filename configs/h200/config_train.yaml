# Parametros de Treinamento
# Perfil do TCC: 2x H200 de 141 GB (bf16 nativo), fine-tuning completo como no artigo.
# Gerado a partir de configs/config_train.yaml. So mudam os valores que dependem do hardware.

hardware:
  # Vazio: uma GPU. "1": somente a segunda placa.
  # "0,1": treino em DDP e mineracao nas duas placas.
  # Treino em DDP (torchrun e lancado sozinho) e mineracao repartida nas duas placas.
  gpus: "0,1"

modelo:
  model_id: "Qwen/Qwen3-Embedding-4B"
  max_seq_length: 768
  query_instruction: "Instruct: Dado um trecho de um documento jurídico brasileiro, recupere o trecho mais relevante semanticamente.\nQuery: "
  pooling_mode: "lasttoken"
  normalizar_embeddings: true
  
  # "sdpa" (nativo PyTorch 2.x). A V100 nao roda "flash_attention_2".
  attn_implementation: "sdpa"

# Full fine-tuning de 4B nao cabe em 32 GB (pesos + gradientes + Adam passam de 60 GB).
# Com LoRA a base fica congelada em fp16 e so os adaptadores treinam.
# Na H200, ativo: false volta ao full fine-tuning do artigo.
lora:
  ativo: false
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

treinamento:
  # Lote POR GPU. Com 2 GPUs e gather_across_devices, o lote contrastivo e 2 x 32 = 64,
  # o mesmo do perfil da V100: cada ancora ve os positivos e negativos das outras 63 tuplas.
  # Subir para 64 por GPU dobra os concorrentes do lote e muda a variante "nenhum":
  # se mudar, mude para as tres variantes.
  # mini_batch_size so controla a memoria do GradCache, nao muda o resultado.
  batch_size_train: 32
  mini_batch_size: 16
  gradient_accumulation_steps: 1
  
  # "auto": bf16 na A100/H200, fp16 na V100.
  precisao: "auto"
  gradient_checkpointing: false # Sobra memoria na H200
  
  # Sorteia N tuplas (mesma semente nas tres variantes). null usa todas.
  # Na H200 a ideia e usar todas as tuplas.
  limite_tuplas: null
  
  # Otimizacao de alimentacao CPU -> GPU
  dataloader_num_workers: 4
  dataloader_pin_memory: false
  
  # Otimizador e escalonamento. Full fine-tuning: mesmo LR do artigo.
  num_epochs: 1
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  
  # Frequencia de checkpoints e avaliacao
  eval_steps: 200
  save_steps: 200
  save_total_limit: 2 # O melhor checkpoint e sempre mantido
  # gpunode02 tem pouco disco livre: ao fim de cada variante fica so o modelo escolhido
  # (best_model_4b, ~8 GB). Os checkpoints de ~24 GB sao apagados. Durante o treino, retomar continua possivel.
  apagar_checkpoints_ao_fim: true
  metric_for_best_model: "val_cosine_ndcg@10"
  greater_is_better: true

loss:
  nome: "CachedMultipleNegativesRankingLoss"
  scale: 50.0

avaliacao:
  eval_batch_size: 128
  # Validacao durante o treino com amostra fixa de processos (mesma nas tres variantes).
  # No TJRS sao ~11 chunks por processo: 1000 processos = ~11 mil chunks, poucos minutos na H200.
  # A Etapa 5 sempre usa o split de teste completo.
  max_processos_val: 1000
  # Precisao dos pesos na Etapa 5. "fp32" se aparecer NaN em fp16.
  precisao: "auto"
  metricas:
    - "ndcg@10"
    - "mrr@10"
    - "accuracy@1"
    - "accuracy@5"
    - "accuracy@10"
    - "map@100"
