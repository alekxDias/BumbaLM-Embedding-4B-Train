# Parametros de Treinamento
# Perfil do TCC: node2 (gpunode02) com duas NVIDIA H200 de 141 GB, bf16 nativo.
# O perfil da V100S do tapajos esta na branch tcc/ablacao-negativos-tjma.

hardware:
  # "0,1": treino em DDP e mineracao nas duas placas.
  # Vazio: uma GPU. "1": somente a segunda placa.
  gpus: "0,1"

modelo:
  model_id: "Qwen/Qwen3-Embedding-4B"
  max_seq_length: 768
  query_instruction: "Instruct: Dado um trecho de um documento jurídico brasileiro, recupere o trecho mais relevante semanticamente.\nQuery: "
  pooling_mode: "lasttoken"
  normalizar_embeddings: true

  # "sdpa" (nativo PyTorch 2.x). Em bf16 na H200 ele ja usa o kernel flash do proprio PyTorch,
  # sem depender do pacote flash-attn.
  attn_implementation: "sdpa"

# Full fine-tuning, como no artigo (main). Na H200 cabe: pesos, gradientes e Adam em bf16 ~32 GB por placa.
# ativo: true troca para LoRA (treino ~1,3x mais rapido e checkpoints de ~0,4 GB em vez de ~24 GB).
lora:
  ativo: false
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

treinamento:
  # Lote contrastivo por GPU. Com as duas placas e gather_across_devices, cada ancora
  # disputa com as outras 127 tuplas do passo.
  # mini_batch_size so controla a memoria do GradCache, nao muda o resultado.
  batch_size_train: 64
  mini_batch_size: 16
  gradient_accumulation_steps: 1

  # "auto": bf16 na H200.
  precisao: "auto"
  # Pesos em fp32 e bf16 so na autocast. No diagnostico de 03/11/2026 o bf16 puro teve grad_norm
  # 3 a 5x maior e validacao pior (MRR 0,774 x 0,806): atualizacoes de ~2e-5 somem no arredondamento
  # do bf16. Com fp32 o passo fica ~60% mais lento e o gradient checkpointing segura a memoria (~87 GB).
  gradient_checkpointing: true
  pesos_fp32: true

  # Loss e grad_norm a cada N passos. A validacao no passo 0 mede o modelo base na mesma curva.
  logging_steps: 10
  avaliar_no_inicio: true

  # Sorteia N tuplas (mesma semente nas tres variantes). null usa todas.
  # A mineracao rende ~2,4 tuplas por acordao de treino (o teto relativo descarta ~75% dos chunks):
  # 60 mil acordaos deram 116.419 tuplas; 100 mil devem dar ~195 mil (o artigo do TJMA usou 212.633).
  limite_tuplas: null

  # Otimizacao de alimentacao CPU -> GPU
  dataloader_num_workers: 4
  dataloader_pin_memory: false

  # Otimizador e escalonamento (os do artigo, full fine-tuning)
  num_epochs: 1
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"

  # Frequencia de checkpoints e avaliacao. 174.037 tuplas / 128 por passo = ~1.360 passos.
  # 136: 10 validacoes, a ultima no fim do treino (mesma proporcao do Colab).
  eval_steps: 136
  save_steps: 136
  # 1: fica o ultimo e o melhor. Com pesos em fp32, cada checkpoint (pesos + Adam) tem ~48 GB.
  save_total_limit: 1
  metric_for_best_model: "val_cosine_ndcg@10"
  greater_is_better: true

loss:
  nome: "CachedMultipleNegativesRankingLoss"
  scale: 50.0

avaliacao:
  eval_batch_size: 128
  # Validacao durante o treino com amostra fixa de processos (mesma nas tres variantes).
  # No TJRS sao ~11 chunks por processo: 300 processos = ~3.400 chunks.
  # A Etapa 5 sempre usa o split de teste completo.
  max_processos_val: 300
  # O treino para se a validacao do passo 0 ficar abaixo disto: o modelo base passa de 0,5.
  # Um valor perto de zero indica modelo montado errado (foi o caso do diagnostico de 03/11/2026).
  mrr_minimo_passo0: 0.2
  # Precisao dos pesos na Etapa 5. fp32: testa exatamente o modelo que foi validado no treino.
  precisao: "fp32"
  metricas:
    - "ndcg@10"
    - "mrr@10"
    - "accuracy@1"
    - "accuracy@5"
    - "accuracy@10"
    - "map@100"
