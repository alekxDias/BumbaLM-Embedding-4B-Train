# Parametros de Treinamento

hardware:
  # Vazio: uma GPU. "1": somente a segunda placa.
  # "0,1": treino em DDP e mineracao nas duas placas.
  gpus: "0"

modelo:
  model_id: "Qwen/Qwen3-Embedding-4B"
  max_seq_length: 768
  query_instruction: "Instruct: Dado um trecho de um documento jurídico brasileiro, recupere o trecho mais relevante semanticamente.\nQuery: "
  pooling_mode: "lasttoken"
  normalizar_embeddings: true
  
  # "sdpa" (nativo PyTorch 2.x), "eager" (estavel em qualquer driver) ou "flash_attention_2"
  attn_implementation: "eager"

treinamento:
  # Lotes para A100 (40 GB) com GradCache. No smoke PBS use batch menor via CLI.
  batch_size_train: 32
  mini_batch_size: 8
  gradient_accumulation_steps: 1

  # Otimizacao de memoria e velocidade
  bf16: true
  gradient_checkpointing: false

  # Otimizacao de alimentacao CPU -> GPU
  dataloader_num_workers: 4
  dataloader_pin_memory: false

  # Otimizador e escalonamento
  num_epochs: 1
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"

  # Frequencia de checkpoints e avaliacao (smoke com poucos dados: steps baixos)
  eval_steps: 50
  save_steps: 50
  save_total_limit: 2
  metric_for_best_model: "val_cosine_ndcg@10"
  greater_is_better: true

loss:
  nome: "CachedMultipleNegativesRankingLoss"
  scale: 50.0

avaliacao:
  eval_batch_size: 128
  metricas:
    - "ndcg@10"
    - "mrr@10"
    - "accuracy@1"
    - "accuracy@5"
    - "accuracy@10"
    - "map@100"
