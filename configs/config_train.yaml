# Parametros de Treinamento

hardware:
  # Vazio: uma GPU. "1": somente a segunda placa.
  # "0,1": treino em DDP e mineracao nas duas placas.
  gpus: "0"

modelo:
  model_id: "Qwen/Qwen3-Embedding-4B"
  max_seq_length: 768
  query_instruction: "Instruct: Dado um trecho de um documento jurídico brasileiro, recupere o trecho mais relevante semanticamente.\nQuery: "
  pooling_mode: "lasttoken"
  normalizar_embeddings: true
  
  # Baseline (train_4b.py) nao fixa o kernel. eager evita materializar flash/sdpa.
  attn_implementation: "eager"

treinamento:
  # Lote 16 = grupo contrastivo. Acumulacao 4 → passo efetivo 64.
  # Mini-lote 1: na V100 o GradCache parte o forward; a perda continua no lote de 16.
  batch_size_train: 16
  mini_batch_size: 1
  gradient_accumulation_steps: 4

  bf16: false
  fp16: false
  gradient_checkpointing: true
  optim: "adamw_torch"
  logging_steps: 1

  dataloader_num_workers: 0
  dataloader_pin_memory: false

  num_epochs: 1
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"

  # Mesma cadencia do baseline 4B. Com 500 amostras o trainer encurta se o total de steps for menor.
  eval_steps: 500
  save_steps: 500
  save_total_limit: 2
  metric_for_best_model: "val_cosine_ndcg@10"
  greater_is_better: true

loss:
  nome: "CachedMultipleNegativesRankingLoss"
  scale: 50.0

avaliacao:
  # InformationRetrievalEvaluator do train_4b.py usa 32. O 128 e do train_4b_v2.py.
  eval_batch_size: 32
  metricas:
    - "ndcg@10"
    - "mrr@10"
    - "accuracy@1"
    - "accuracy@5"
    - "accuracy@10"
    - "map@100"
